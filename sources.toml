# Conformance

[[source]]
id = "codegen"
kind = "conformance"
matrix = "codegen"
title = "Code generators"
repo = "generation"
branch = "master"
path = "features.json"

[[source]]
id = "wire-rust"
kind = "conformance"
matrix = "wire"
title = "Rust runtime"
repo = "runtime"
branch = "main"
path = "runtime/conformance/reports/rust.json"
features = { repo = "specification", path = "features.json" }

[[source]]
id = "wire-typescript"
kind = "conformance"
matrix = "wire"
title = "TypeScript runtime"
repo = "comline-typescript"
branch = "main"
path = "runtime/conformance-report.json"
features = { repo = "specification", path = "features.json" }

