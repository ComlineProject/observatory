# What the collector reads. Format: DATA.md.

[[repo]]
name = "runtime"
url = "https://github.com/ComlineProject/runtime"
default_branch = "main"
tag = '^v(?P<version>\d+\.\d+\.\d+(?:[-+].*)?)$'

[[repo]]
name = "generation"
url = "https://github.com/ComlineProject/generation"
default_branch = "master"
tag = '^v(?P<version>\d+\.\d+\.\d+(?:[-+].*)?)$'

[[repo]]
name = "comline-typescript"
url = "https://github.com/ComlineProject/comline-typescript"
default_branch = "main"
tag = '^v(?P<version>\d+\.\d+\.\d+(?:[-+].*)?)$'

[[repo]]
name = "core"
url = "https://github.com/ComlineProject/core"
default_branch = "master"
tag = '^comline-core-v(?P<version>\d+\.\d+\.\d+(?:[-+].*)?)$'

[[repo]]
name = "specification"
url = "https://github.com/ComlineProject/specification"
default_branch = "main"
# The spec's own version (VERSION), as `v0.10`.
tag = '^v(?P<version>\d+\.\d+(?:\.\d+)?)$'

[[repo]]
name = "cli"
url = "https://github.com/ComlineProject/cli"
default_branch = "main"
tag = '^v(?P<version>\d+\.\d+\.\d+(?:[-+].*)?)$'

[[repo]]
name = "simulator"
url = "https://github.com/ComlineProject/simulator"
default_branch = "main"
tag = '^v(?P<version>\d+\.\d+\.\d+(?:[-+].*)?)$'

[[repo]]
name = "language-server"
url = "https://github.com/ComlineProject/language-server"
default_branch = "master"
tag = '^v(?P<version>\d+\.\d+\.\d+(?:[-+].*)?)$'

[[repo]]
name = "comline-rust"
url = "https://github.com/ComlineProject/comline-rust"
default_branch = "main"
tag = '^v(?P<version>\d+\.\d+\.\d+(?:[-+].*)?)$'

[[repo]]
name = "docs"
url = "https://github.com/ComlineProject/docs"
default_branch = "main"
tag = '^v(?P<version>\d+\.\d+\.\d+(?:[-+].*)?)$'

[[repo]]
name = "observatory"
url = "https://github.com/ComlineProject/observatory"
default_branch = "main"
tag = '^v(?P<version>\d+\.\d+\.\d+(?:[-+].*)?)$'

# Benchmarks

[[source]]
id = "runtime-bench"
kind = "bench"
title = "Rust runtime"
repo = "runtime"
branch = "reports"
path = "rust.bench.json"
ledger = "runtime/core/benches/accepted-regressions.toml"

[[source]]
id = "typescript-bench"
kind = "bench"
title = "TypeScript runtime"
repo = "comline-typescript"
branch = "reports"
path = "typescript.bench.json"

[[source]]
id = "core-bench"
kind = "bench"
title = "Parser"
repo = "core"
branch = "reports"
path = "core.bench.json"
ledger = "core/benches/accepted-regressions.toml"

